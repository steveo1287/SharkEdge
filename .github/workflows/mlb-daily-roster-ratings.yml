name: MLB Daily Populate And Feed

on:
  workflow_dispatch:
    inputs:
      season:
        description: MLB season year
        required: false
        type: string
      rosterType:
        description: MLB roster type
        required: false
        default: active
        type: choice
        options:
          - active
          - 40Man
          - fullSeason
      statcastUrl:
        description: Optional Baseball Savant Statcast CSV export URL
        required: false
        type: string
  schedule:
    - cron: "15 13 * * *"

jobs:
  populate-and-feed-mlb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MLB_STATS_API_BASE_URL: https://statsapi.mlb.com
      MLB_STATCAST_CSV_URL: ${{ inputs.statcastUrl || secrets.MLB_STATCAST_CSV_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Populate roster ratings and feed MLB model
        run: |
          SEASON="${{ inputs.season }}"
          ROSTER_TYPE="${{ inputs.rosterType }}"
          if [ -z "$SEASON" ]; then SEASON=$(date -u +%Y); fi
          if [ -z "$ROSTER_TYPE" ]; then ROSTER_TYPE=active; fi
          npm run mlb:populate-feed -- \
            --season="$SEASON" \
            --rosterType="$ROSTER_TYPE" \
            --snapshotDate="$(date -u +%F)" \
            --concurrency=6
      - name: Persist enforced team-by-team MLB ratings
        run: |
          SEASON="${{ inputs.season }}"
          ROSTER_TYPE="${{ inputs.rosterType }}"
          if [ -z "$SEASON" ]; then SEASON=$(date -u +%Y); fi
          if [ -z "$ROSTER_TYPE" ]; then ROSTER_TYPE=active; fi
          npm run mlb:elite-upgrade -- \
            --season="$SEASON" \
            --rosterType="$ROSTER_TYPE" \
            --snapshotDate="$(date -u +%F)" \
            --concurrency=6 \
            --persist
      - name: Upload MLB populate/feed report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-populate-feed-report
          path: |
            data/mlb/populate-feed-report-*.json
            data/mlb/daily-roster-rating-snapshot-*.json
            data/mlb/micro/*.json
            data/mlb/quality/*.json
          if-no-files-found: ignore
