name: SharkEdge Board Snapshot

on:
  workflow_dispatch:
    inputs:
      league:
        description: League filter for the generated snapshot
        required: false
        default: ALL
        type: string
      date:
        description: Date filter for the generated snapshot
        required: false
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: sharkedge-board-snapshot
  cancel-in-progress: true

jobs:
  generate-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
      ODDSAPI_IO_KEY_2: ${{ secrets.ODDSAPI_IO_KEY_2 }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate board snapshot
        run: |
          LEAGUE="${{ github.event.inputs.league }}"
          SNAPSHOT_DATE="${{ github.event.inputs.date }}"
          if [ -z "$LEAGUE" ]; then LEAGUE=ALL; fi
          if [ -z "$SNAPSHOT_DATE" ]; then SNAPSHOT_DATE=all; fi
          npm run shark:snapshot -- --league="$LEAGUE" --date="$SNAPSHOT_DATE" --out=/tmp/latest-board.json

      - name: Publish snapshot to snapshot-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          mkdir -p "$WORKDIR/data"
          cp /tmp/latest-board.json "$WORKDIR/data/latest-board.json"
          cat > "$WORKDIR/README.md" <<'EOF'
          # SharkEdge Snapshot Data

          This branch is generated by the SharkEdge Board Snapshot workflow.
          It is intentionally separate from `main` so refreshing data does not trigger a Railway redeploy.
          EOF
          cd "$WORKDIR"
          git init
          git checkout -b snapshot-data
          git config user.name "sharkedge-snapshot-bot"
          git config user.email "snapshot-bot@sharkedge.local"
          git add README.md data/latest-board.json
          git commit -m "Update board snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin snapshot-data
